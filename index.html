<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi Rahasia Untuk Mas ❤️</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#ff9a9e,#fad0c4);
        text-align:center;
        padding-top:50px;
        color:#333;
    }

    .box{
        background:white;
        width:350px;
        margin:auto;
        padding:30px;
        border-radius:20px;
        box-shadow:0 0 15px rgba(0,0,0,0.2);
    }

    button{
        padding:12px 25px;
        font-size:18px;
        border:none;
        border-radius:10px;
        background:#ff4d6d;
        color:white;
        cursor:pointer;
    }

    button:hover{
        background:#e63956;
    }

    #loveMessage{
        display:none;
        margin-top:20px;
        font-size:24px;
        color:#ff1744;
        font-weight:bold;
        animation: muncul 1s ease-in-out;
    }

    @keyframes muncul{
        from{
            opacity:0;
            transform:scale(0.5);
        }
        to{
            opacity:1;
            transform:scale(1);
        }
    }
</style>
</head>
<body>

<div class="box">
    <h2>🎮 </h2>
    <p>Klik tombol ❤️ sebanyak 10 kali untuk menyelesaikan misi!</p>

    <h3>Progress: <span id="count">0</span>/10</h3>

    <button onclick="mainGame()">❤️ Klik Aku</button>

    <div id="loveMessage">
         I LOVE YOU TOO, MAS BOTAKKUUU<br><br>
        terimakasii sudah menjadi botak favorit cyntiaa yang lucu dan menggemaskan
    </div>
</div>

<script>
let score = 0;

function mainGame(){
    score++;
    document.getElementById("count").innerText = score;

    if(score >= 10){
        document.getElementById("loveMessage").style.display = "block";
    }
}
</script>

</body>
</html>
